[project]
name = "apple-health-insights"
version = "0.1.0"
description = "Parse an Apple Health export into a private aggregate overview and one insight."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apple-health-insights = "apple_health_insights.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
